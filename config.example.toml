# camscan-escl — copy to ~/.config/camscan-escl/config.toml
#
# Every value here is also the built-in default, so an absent config file
# behaves identically to this one.

[server]
port = 8090
bind = "127.0.0.1"          # widen only if scanning from another host

[discovery]
# Advertise over DNS-SD (_uscan._tcp) so front-ends find the device without
# Manual IP. Needs the optional `zeroconf` package; without it the daemon
# still runs and Manual IP still works.
enable = true
# The DNS-SD instance name. Keep it plain: NAPS2's search ignored an advert
# named "camscan-escl (Logitech C920) [camscan-0001]" even though every TXT
# key it requires was present. The name a front-end displays comes from
# scanner.make_and_model, not from this.
name = "camscan"

[scanner]
make_and_model = "camscan-escl (Logitech C920)"
serial = "camscan-0001"
resolution_dpi = 150        # declare only what the rig can actually deliver
jpeg_quality = 88

[capture]
# ffmpeg, not fswebcam. 2304x1536 exists only in YUYV on the C920, and
# fswebcam negotiates MJPG and silently returns 1920x1080 -- measured on this
# host, exactly the failure spec section 8 warns about. ffmpeg pins the pixel
# format, so it actually gets the still mode. The daemon logs loudly if a
# capture comes back at the wrong size either way.
command = "ffmpeg -loglevel error -f v4l2 -pix_fmt yuyv422 -video_size 2304x1536 -i /dev/video0 -frames:v 3 -update 1 -y %f"
native_width = 2304
native_height = 1536
timeout_s = 30
rotate_deg = 0              # 90 or 270 if the camera is mounted portrait

# The fswebcam form from the spec, kept for reference. Verify the output size
# before trusting it:
# command = "fswebcam -d /dev/video0 -r 2304x1536 --no-banner -S 4 --jpeg 92 %f"

[preview]
# A live preview at http://<host>:8090/preview with crop marks showing where
# each paper size will land. The daemon holds the camera for this and hands
# it back for a scan -- V4L2 access is exclusive, so nothing else can use the
# camera while this is on. Turn it off to free the device for Kamoso etc.
enable = true
# MUST be 16:9. Measured on the C920: 16:9 modes are the still's full width
# with a centred vertical crop, so preview pixels map onto still pixels
# exactly. 4:3 modes are zoomed to a narrower field and cannot be mapped --
# the daemon refuses to start with one rather than draw lying crop marks.
width = 1280
height = 720
fps = 15

# Shrink the picture when a crop mark would otherwise fall entirely outside
# it. A paper bigger than the coverage has all four edges off-screen, so it
# draws nothing at all -- exactly when it most needs to be seen, because it
# is telling you the paper does not fit and the camera needs raising.
fit_marks = true

# Publish the marked-up video as a virtual webcam, so Kamoso, Cheese or a
# video call shows the crop marks burned in. Needs the v4l2loopback module --
# see README. Empty means the preview is web-only.
# loopback_device = "/dev/video9"

[preview.papers]
# name = [width_mm, height_mm]
A4 = [210.0, 297.0]
A5 = [148.0, 210.0]
Letter = [215.9, 279.4]

[capture.exposure]
# Off by default: the right numbers are rig-specific, and a wrong pinned
# exposure is worse than a variable one. Turn this on once you have measured
# them, or scans will vary with the light in the room -- a bright scene can
# come back washed to near-white. See README, "Calibrate".
lock = false
# time_absolute = 120              # from a sweep at the rig's working light
# white_balance_temperature = 4000 # kelvin; stops paper going blue or orange

[capture.focus]
device = "/dev/video0"
# Autofocus by default. The spec pins focus because autofocus can hunt
# between pages -- a real risk, but conditional, whereas a wrong fixed value
# is always wrong. The 40 that used to ship here was measurably softer than
# what the camera chooses for itself. Pin it only if you see hunting, and get
# the number from `camscan-escl --focus-sweep`.
disable_autofocus = false
absolute = 0                # only used when disable_autofocus = true

[rig]
# The physical area the frame covers at rig height, in mm, [width, height],
# in the orientation the frame ends up after rotate_deg. This is the
# calibration that makes the units contract correct — measure it with a ruler
# under the camera, do not assume it.
coverage_mm = [210.0, 297.0]
