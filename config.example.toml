# camscan-escl — copy to ~/.config/camscan-escl/config.toml
#
# Every value here is also the built-in default, so an absent config file
# behaves identically to this one.

[server]
port = 8090
bind = "127.0.0.1"          # widen only if scanning from another host

[discovery]
# Advertise over DNS-SD (_uscan._tcp) so front-ends find the device without
# Manual IP. Needs the optional `zeroconf` package; without it the daemon
# still runs and Manual IP still works.
enable = true

[scanner]
make_and_model = "camscan-escl (Logitech C920)"
serial = "camscan-0001"
resolution_dpi = 150        # declare only what the rig can actually deliver
jpeg_quality = 88

[capture]
# ffmpeg, not fswebcam. 2304x1536 exists only in YUYV on the C920, and
# fswebcam negotiates MJPG and silently returns 1920x1080 -- measured on this
# host, exactly the failure spec section 8 warns about. ffmpeg pins the pixel
# format, so it actually gets the still mode. The daemon logs loudly if a
# capture comes back at the wrong size either way.
command = "ffmpeg -loglevel error -f v4l2 -pix_fmt yuyv422 -video_size 2304x1536 -i /dev/video0 -frames:v 3 -update 1 -y %f"
native_width = 2304
native_height = 1536
timeout_s = 30
rotate_deg = 0              # 90 or 270 if the camera is mounted portrait

# The fswebcam form from the spec, kept for reference. Verify the output size
# before trusting it:
# command = "fswebcam -d /dev/video0 -r 2304x1536 --no-banner -S 4 --jpeg 92 %f"

[capture.exposure]
# Off by default: the right numbers are rig-specific, and a wrong pinned
# exposure is worse than a variable one. Turn this on once you have measured
# them, or scans will vary with the light in the room -- a bright scene can
# come back washed to near-white. See README, "Calibrate".
lock = false
# time_absolute = 120              # from a sweep at the rig's working light
# white_balance_temperature = 4000 # kelvin; stops paper going blue or orange

[capture.focus]
device = "/dev/video0"
absolute = 40               # from a one-off sweep at the rig's working distance
disable_autofocus = true

[rig]
# The physical area the frame covers at rig height, in mm, [width, height],
# in the orientation the frame ends up after rotate_deg. This is the
# calibration that makes the units contract correct — measure it with a ruler
# under the camera, do not assume it.
coverage_mm = [210.0, 297.0]
