# camscan-escl — copy to ~/.config/camscan-escl/config.toml
#
# Every value here is also the built-in default, so an absent config file
# behaves identically to this one.

[server]
port = 8090
bind = "127.0.0.1"          # widen only if scanning from another host

[discovery]
# Advertise over DNS-SD (_uscan._tcp) so front-ends find the device without
# Manual IP. Needs the optional `zeroconf` package; without it the daemon
# still runs and Manual IP still works.
enable = true
# The DNS-SD instance name. Keep it plain: NAPS2's search ignored an advert
# named "camscan-escl (Logitech C920) [camscan-0001]" even though every TXT
# key it requires was present. The name a front-end displays comes from
# scanner.make_and_model, not from this.
name = "camscan"

[scanner]
make_and_model = "camscan-escl (Logitech C920)"
serial = "camscan-0001"
resolution_dpi = 150        # declare only what the rig can actually deliver
jpeg_quality = 88

[capture]
# HOW TO FIND THE CAMERA. Deliberately not a /dev/videoN number.
#
# Those numbers are handed out in probe order and move between boots. On the
# rig this was written for, v4l2loopback is autoloaded with no `video_nr=` and
# races USB enumeration for the first free node; on 2026-08-29 it won, took
# /dev/video0, and a config pinned to the previous boot spent half an hour
# reading from the loopback and writing to the camera's metadata node.
#
#   auto                      first node that can capture video (skips
#                             loopbacks, which would otherwise be this
#                             daemon's own output)
#   card:HD Pro Webcam C920   named by card, which is exact
#   /dev/video1               a literal path; checked, and refused with an
#                             explanation if it is the wrong kind of device
#
# `camscan-escl --diagnose` prints every node and what each setting resolves
# to. Cards are matched case-insensitively, and a substring is enough.
device = "auto"

# ffmpeg, not fswebcam. 2304x1536 exists only in YUYV on the C920, and
# fswebcam negotiates MJPG and silently returns 1920x1080 -- measured on this
# host, exactly the failure spec section 8 warns about. ffmpeg pins the pixel
# format, so it actually gets the still mode. The daemon logs loudly if a
# capture comes back at the wrong size either way.
#
# %d is the device resolved from `device` above; %f is the output path. A
# command with no %d is run exactly as written, so an existing hand-rolled
# one still works -- it just keeps whatever number is baked into it.
command = "ffmpeg -loglevel error -f v4l2 -pix_fmt yuyv422 -video_size 2304x1536 -i %d -frames:v 3 -update 1 -y %f"
native_width = 2304
native_height = 1536
timeout_s = 30
rotate_deg = 0              # 90 or 270 if the camera is mounted portrait

# The fswebcam form from the spec, kept for reference. Verify the output size
# before trusting it:
# command = "fswebcam -d %d -r 2304x1536 --no-banner -S 4 --jpeg 92 %f"

[preview]
# A live preview at http://<host>:8090/preview with crop marks showing where
# each paper size will land. The daemon holds the camera for this and hands
# it back for a scan -- V4L2 access is exclusive, so nothing else can use the
# camera while this is on. Turn it off to free the device for Kamoso etc.
enable = true
# The camera's streaming mode. MUST be 16:9. Measured on the C920: 16:9 modes
# are the still's full width with a centred vertical crop, so preview pixels
# map onto still pixels exactly. 4:3 modes are zoomed to a narrower field and
# cannot be mapped -- the daemon refuses to start with one rather than draw
# lying crop marks.
#
# Nothing else needs changing when this does. The canvas, the streamed band,
# the strip the anchored edge drops, the scale and where every mark lands are
# all derived from this pair and the still's size. A bigger mode is a sharper
# preview and nothing else: it does not change what a scan captures.
#
# The settings GUI offers whatever this camera reports, so there is no list of
# one model's modes anywhere in the daemon. It offers only EXACT 16:9 sizes.
# The C920's 800x448 and 1600x896 are 1.7857 and pass the check below, but the
# full-width-centred-crop relationship was never measured for them, so they
# are configurable by hand and not offered.
width = 1280
height = 720
fps = 15

# Extend the picture further still, for a sheet larger than the camera can
# capture AT ALL, so its mark can be seen rather than clipped at the edge.
#
# This is a third zone beyond the two the frame already carries. The published
# frame is the scannable area and the live stream sits inside it; this is for
# paper that runs past even the scannable area. Only on the sides it actually
# overflows -- the anchor holds a mark flush against the edge it names, so that
# side never overflows and never gets an extension.
fit_marks = true

# Show the last scan, faintly, in the border.
#
# The scan captures the whole still and the preview is a 16:9 crop of it, so
# the border is not empty space -- it is space the SCANNER reaches and the live
# view cannot.
#
# The captured still is kept unrotated alongside the composited overlay, so a
# settings change REDRAWS the border rather than blanking it: ticking a paper
# size or turning the camera moves where the still belongs, but the still is a
# photograph of the desk and stays true. No rescan needed.
scan_ghost = true
# How much of it shows through, 0 invisible to 1 full strength. Faint on
# purpose: it is a still, and must never be mistaken for the live view.
scan_ghost_opacity = 0.38

# The most of the frame that may become border, as a fraction. Past this the
# overflow clips instead, because a border wide enough to swallow the picture
# tells you less about where the paper goes than a clipped mark does. The
# sidebar reports the overflow in millimetres either way.
max_pad = 0.35

# Publish the marked-up video as a virtual webcam, so Kamoso, Cheese or a
# video call shows the crop marks burned in. Needs the v4l2loopback module --
# see README. Empty means the preview is web-only.
#
# Takes the same forms as capture.device, and name it the same way and for the
# same reason: the loopback's number moves between boots too. The card name is
# whatever `card_label` its modprobe options set.
# loopback_device = "card:OBS Virtual Camera"

[preview.papers]
# name = [width_mm, height_mm]
A4 = [210.0, 297.0]
A5 = [148.0, 210.0]
Letter = [215.9, 279.4]

[capture.image]
# Brightness and contrast, as V4L2 controls on the camera -- so a scan gets
# the picture the preview showed. Unset leaves the camera alone. The settings
# window drives these, and its Auto button meters the live picture and fills
# them in. The C920 takes 0..255 for both, defaulting to 128, but the daemon
# reads the real range off whatever camera is attached.
# brightness = 128
# contrast = 128

# The mains frequency the camera cancels, so artificial light does not band
# the picture. Pinned for the same reason focus and exposure are: V4L2 state
# lives on the device and survives whatever last touched it, and the C920's
# own default is 60 Hz — so a replug or a module reload silently puts a 50 Hz
# rig back onto banding.
#
#   "auto"      work it out from the host timezone (the default)
#   "50" / "60" state it, for a rig running off a grid the host is not on
#   "disabled"  turn the camera's filter off entirely
#   ""          leave the control alone, whatever last set it
#
# "auto" reads /etc/localtime (or TZ) and looks the zone up: 50 Hz is the
# world default and only the 60 Hz regions are listed, with the 50 Hz islands
# inside them — the southern cone, Greenland, the French territories — named
# back. It is wrong only for a rig on a grid its host is not on, which is what
# stating the number is for. Asia/Tokyo resolves to 50, being the eastern
# half of a country that runs both.
power_line_frequency = "auto"

[capture.exposure]
# Off by default: the right numbers are rig-specific, and a wrong pinned
# exposure is worse than a variable one. Turn this on once you have measured
# them, or scans will vary with the light in the room -- a bright scene can
# come back washed to near-white. See README, "Calibrate".
lock = false
# time_absolute = 120              # from a sweep at the rig's working light
# white_balance_temperature = 4000 # kelvin; stops paper going blue or orange

[capture.focus]
# No `device` here on purpose: unset means "follow capture.device", which is
# what you want unless the focus controls live on a different node than the
# capture. It takes the same forms as capture.device if you do set it.
# Autofocus by default. The spec pins focus because autofocus can hunt
# between pages -- a real risk, but conditional, whereas a wrong fixed value
# is always wrong. The 40 that used to ship here was measurably softer than
# what the camera chooses for itself. Pin it only if you see hunting, and get
# the number from `camscan-escl --focus-sweep`.
disable_autofocus = false
absolute = 0                # only used when disable_autofocus = true

[rig]
# The physical area the SCANNABLE AREA covers at rig height, in mm,
# [width, height], in the orientation the frame ends up after rotate_deg.
# This is the calibration that makes the units contract correct — measure it
# with a ruler under the camera, do not assume it. Set the anchor first: an
# edge anchor makes the scannable area smaller than the sensor, so a
# measurement taken before it is 8% wrong after it.
coverage_mm = [210.0, 297.0]

# Where the scan region sits inside that coverage. Clients always send an
# origin of 0,0, so without this every scan is pinned to the top left of what
# the camera sees. One of: top-left, top, top-right, left, center, right,
# bottom-left, bottom, bottom-right.
#
# An EDGE anchor also decides the size of the scannable area. The live
# preview is 16:9 and the still is 3:2, so the picture is the middle 1296 of
# the sensor's 1536 rows and a 120-row strip at each end is scannable but
# never streamed. Take the whole still as the scannable area and its edge —
# the line an edge-anchored mark is drawn flush against — sits 120 rows
# outside the picture, and you cannot watch a sheet register against a line
# you cannot see. So the strip on the anchored edge is dropped, and the two
# edges become one line.
#
# It costs 120 sensor rows, about 8% of the sensor, and it works at any
# camera height: no particular height is needed to make the marks true. The
# far strip is kept, and is scanned but never streamed. A centred anchor
# registers against nothing and keeps both strips.
anchor = "center"
